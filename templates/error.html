<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error - Stock Predictor Pro</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 40px; background-color: #f5f5f5; text-align: center; }
        .error-container { background: white; padding: 40px; border-radius: 10px; max-width: 600px; margin: 0 auto; }
        .error-message { color: #dc3545; background: #f8d7da; padding: 15px; border-radius: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>❌ Error</h1>
        <div class="error-message">
            {{ error_message }}
        </div>
        <p>Please try again or contact support if the problem persists.</p>
        <a href="/dashboard" style="background: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px;">
            Return to Dashboard
        </a>
    </div>
</body>
</html>
