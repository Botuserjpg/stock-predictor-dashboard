{% extends "base.html" %}
{% block title %}Forgot Password — {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>🔑 Forgot Password</h1>
    <p class="subtitle">We'll issue you a reset link</p>

    {% if error %}
        <div class="flash flash-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">Enter your email address</label>
            <input type="email" id="email" name="email" required placeholder="trader@example.com">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>

    <div class="auth-links">
        <a href="{{ url_for('auth.login') }}">← Back to Login</a>
    </div>
</div>
{% endblock %}
