{% extends "base.html" %}
{% block title %}Reset Password — {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>🔒 Reset Password</h1>

    {% if error %}
        <div class="flash flash-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" id="resetForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="new_password">New Password</label>
            <div class="password-wrap">
                <input type="password" id="new_password" name="password" required minlength="8"
                       placeholder="Enter new password">
                <button type="button" class="password-toggle" aria-label="Show password">👁️</button>
            </div>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <div class="password-wrap">
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8"
                       placeholder="Confirm new password">
                <button type="button" class="password-toggle" aria-label="Show password">👁️</button>
            </div>
        </div>
        <button type="submit" class="btn btn-success btn-block">Reset Password</button>
    </form>

    <div class="auth-links">
        <a href="{{ url_for('auth.login') }}">← Back to Login</a>
    </div>
</div>
{% endblock %}
