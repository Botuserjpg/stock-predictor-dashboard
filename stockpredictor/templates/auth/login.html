{% extends "base.html" %}
{% block title %}Login — {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>🔐 Sign In</h1>
    <p class="subtitle">AI-Powered Market Intelligence</p>

    {% if error %}
        <div class="flash flash-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">Email Address</label>
            <input type="email" id="username" name="username" required placeholder="trader@example.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
                <input type="password" id="password" name="password" required placeholder="Enter your password">
                <button type="button" class="password-toggle" aria-label="Show password">👁️</button>
            </div>
        </div>
        <div class="form-group checkbox-group">
            <input type="checkbox" id="remember_me" name="remember_me">
            <label for="remember_me">Remember me for 30 days</label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enter Trading Dashboard</button>
    </form>

    <div class="auth-links">
        <a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a>
        <p>New to trading? <a href="{{ url_for('auth.register') }}">Create account</a></p>
    </div>
</div>
{% endblock %}
